[package]
name = "wispr"
version = "0.1.0"
edition = "2021"
description = "Ultra-lightweight system-wide voice-to-text dictation tool for Windows in Rust"

[dependencies]
# Audio Capture
cpal = "0.15"

# 2D Vector Rendering for Layered Overlay
tiny-skia = "0.11"

# Speech-to-Text Engines
whisper-rs = { version = "0.16", features = ["vulkan"] }
sherpa-onnx = { version = "2.0.1", default-features = false, features = ["shared"] }

# Windows Native APIs
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Security",
    "Media_Control",
    "Foundation",
] }

# Async & Networking
tokio = { version = "1.43", features = ["rt-multi-thread", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
regex = "1.11"

# Utilities & Concurrency
parking_lot = "0.12"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
